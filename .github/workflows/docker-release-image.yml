#
# Builds and publishes a multi-arch (linux/amd64 + linux/arm64) Docker image bundling the DuckDB
# CLI with the `quack` and `httpfs` extensions pre-loaded (see Dockerfile). Runs only on tag
# pushes -- release images are versioned from the tag itself, not built on every commit.
#
# Uses GitHub's native amd64/arm64 hosted runners (one native build per arch, merged into a single
# multi-arch manifest afterward) instead of QEMU emulation, mirroring the same per-arch runner
# split MainDistributionPipeline.yml's Linux build matrix already uses.
#
name: Docker Release Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    # Guards workflow_dispatch runs against a branch: this job only ever does something useful
    # (and only ever gets a real version to tag the image with) for an actual tag ref.
    if: startsWith(github.ref, 'refs/tags/')
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the combined manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${{ github.ref_name }}" \
            -t "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${{ github.ref_name }}-amd64" \
            "${IMAGE_NAME}:${{ github.ref_name }}-arm64"
